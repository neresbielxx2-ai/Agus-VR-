name: Android Build

on:
  push:
    branches:
      - main
      - arena/01a09621-agus-vr
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Compilar APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (obrigatório para AGP 8.x)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Instala o Gradle 8.4 diretamente (o wrapper .jar não é versionado
      # neste repositório; a action também faz cache de dependências).
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Aceitar licenças e garantir platform 34 + build-tools
        run: |
          SDKMGR=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMGR="sdkmanager"
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR="$(find "${ANDROID_HOME}" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          fi
          if [ -n "${SDKMGR}" ]; then
            echo "usando ${SDKMGR}"
            yes | "${SDKMGR}" --licenses > /dev/null 2>&1 || true
            "${SDKMGR}" --install "platforms;android-34" "build-tools;34.0.0" \
              || echo "::warning::instalação via sdkmanager falhou; AGP tentará baixar sozinho"
          else
            echo "::warning::sdkmanager não encontrado; confiando no auto-download do AGP"
          fi

      - name: Compilar APK debug
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      - name: Compilar APK release (não minificado)
        run: gradle :app:assembleRelease --no-daemon

      - name: Renomear artefatos com versão
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AgusVR-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/AgusVR-release-unsigned.apk

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: agus-vr-apks
          path: |
            dist/AgusVR-debug.apk
            dist/AgusVR-release-unsigned.apk
          retention-days: 30

      # Se o build falhar, publica o trecho relevante do log em uma issue
      # (os logs do Actions nem sempre estão acessíveis fora do GitHub).
      - name: Reportar falha em issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build falhou em \`${GITHUB_SHA}\`"
            echo ""
            echo "<details><summary>Últimas linhas do Gradle</summary>"
            echo ""
            echo '```'
            grep -nE "e: |error:|FAILURE|What went wrong|Caused by|\.kt:" /tmp/gradle-build.log | head -80 \
              || tail -n 60 /tmp/gradle-build.log 2>/dev/null || echo "(sem log capturado)"
            echo '```'
            echo ""
            echo "</details>"
          } > /tmp/report.md
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
                --jq '[.[] | select(.title=="CI: relatório de falha de build")] | .[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CI: relatório de falha de build" \
              --body-file /tmp/report.md
          fi
